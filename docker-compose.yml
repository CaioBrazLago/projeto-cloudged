version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudged-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cloudged']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
